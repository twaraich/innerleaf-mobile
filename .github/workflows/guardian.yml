name: Guardian — Mobile Health

on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  daily-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=moderate || true
      - name: Type check
        run: npx tsc --noEmit
      - name: Expo doctor
        run: npx expo-doctor || true

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
